name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax
        run: bash -n scripts/verify.sh

      - name: Repository invariants
        run: bash scripts/verify.sh

  build:
    name: Android build and lint
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build, unit-test and lint
        run: >-
          gradle --no-daemon --stacktrace --warning-mode=all
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Smoke-test release signing configuration
        shell: bash
        run: |
          if ! keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storetype JKS \
            -storepass ci-password \
            -keypass ci-password \
            -alias ci-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=PixelDenseUI CI,OU=CI,O=PixelDenseUI,L=CI,ST=CI,C=AU'; then
            printf 'ERROR: failed to generate the ephemeral CI signing keystore.\n' >&2
            exit 1
          fi

          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/ci-release.jks"
            printf 'storePassword=%s\n' 'ci-password'
            printf 'keyAlias=%s\n' 'ci-key'
            printf 'keyPassword=%s\n' 'ci-password'
          } > keystore.properties

          if ! gradle --no-daemon --stacktrace --warning-mode=all :app:assembleRelease; then
            printf 'ERROR: signed release smoke build failed.\n' >&2
            exit 1
          fi

          apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -s "$apk" ]]; then
            printf 'ERROR: signing smoke test did not produce %s.\n' "$apk" >&2
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            printf 'ERROR: apksigner was not found under ANDROID_HOME/build-tools.\n' >&2
            exit 1
          fi
          if ! "$apksigner" verify --verbose "$apk"; then
            printf 'ERROR: signed release APK failed apksigner verification.\n' >&2
            exit 1
          fi

      - name: Remove CI signing material
        if: always()
        shell: bash
        run: rm -f ci-release.jks keystore.properties

      - name: Verify build outputs
        shell: bash
        run: |
          errors=0
          if [[ ! -s app/build/outputs/apk/debug/app-debug.apk ]]; then
            printf 'ERROR: debug APK missing.\n' >&2
            errors=$((errors + 1))
          fi
          if [[ ! -s app/build/outputs/apk/release/app-release.apk ]]; then
            printf 'ERROR: signed release smoke APK missing.\n' >&2
            errors=$((errors + 1))
          fi
          if ((errors > 0)); then
            exit 1
          fi

      - name: Ensure build did not mutate repository source
        shell: bash
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [[ -n "$status" ]]; then
            printf 'ERROR: build left repository changes or untracked residue:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDenseUI-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDenseUI-release-smoke-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelDenseUI-lint-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
