name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax
        run: bash -n scripts/verify.sh

      - name: Repository invariants
        run: bash scripts/verify.sh

  build:
    name: Android build and lint
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build, unit-test and lint
        run: >-
          gradle --no-daemon --stacktrace --warning-mode=all
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Verify build outputs
        shell: bash
        run: |
          errors=0
          if [[ ! -s app/build/outputs/apk/debug/app-debug.apk ]]; then
            printf 'ERROR: debug APK missing.\n' >&2
            errors=$((errors + 1))
          fi
          if [[ ! -s app/build/outputs/apk/release/app-release-unsigned.apk && ! -s app/build/outputs/apk/release/app-release.apk ]]; then
            printf 'ERROR: release APK missing.\n' >&2
            errors=$((errors + 1))
          fi
          if ((errors > 0)); then
            exit 1
          fi

      - name: Ensure build did not mutate tracked source
        run: git diff --exit-code

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDenseUI-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelDenseUI-lint-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
