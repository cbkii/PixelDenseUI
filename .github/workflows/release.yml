name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching app versionName (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Require default branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]]; then
            printf 'ERROR: releases must be dispatched from the default branch (%s), got %s.\n' \
              '${{ github.event.repository.default_branch }}' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate tag and source
        shell: bash
        run: |
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "$version_name" ]]; then
            printf 'ERROR: unable to resolve versionName from app/build.gradle.kts.\n' >&2
            exit 1
          fi
          expected_tag="v${version_name}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf 'ERROR: release tag %s does not match versionName; expected %s.\n' "$RELEASE_TAG" "$expected_tag" >&2
            exit 1
          fi
          bash scripts/verify.sh

      - name: Require signing secrets
        shell: bash
        run: |
          missing=0
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              printf 'ERROR: required repository secret %s is not configured.\n' "$name" >&2
              missing=$((missing + 1))
            fi
          done
          if ((missing > 0)); then
            exit 1
          fi

      - name: Prepare release signing
        shell: bash
        run: |
          if ! printf '%s' "$SIGNING_KEY" | base64 --decode > ReleaseKey.jks; then
            printf 'ERROR: SIGNING_KEY is not valid base64 keystore content.\n' >&2
            exit 1
          fi
          if [[ ! -s ReleaseKey.jks ]]; then
            printf 'ERROR: decoded release keystore is empty.\n' >&2
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/ReleaseKey.jks"
            printf 'storePassword=%s\n' "$KEY_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: >-
          gradle --no-daemon --stacktrace --warning-mode=all
          :app:lintRelease
          :app:assembleRelease

      - name: Verify APK signature and stage assets
        shell: bash
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -s "$apk" ]]; then
            printf 'ERROR: signed release APK was not produced at %s.\n' "$apk" >&2
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            printf 'ERROR: apksigner was not found under ANDROID_HOME/build-tools.\n' >&2
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

          mkdir -p dist
          output="dist/PixelDenseUI-${RELEASE_TAG}.apk"
          cp "$apk" "$output"
          (cd dist && sha256sum "$(basename "$output")" > SHA256SUMS.txt)

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'ERROR: GitHub Release %s already exists.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        shell: bash
        run: |
          args=(
            release create "$RELEASE_TAG"
            "dist/PixelDenseUI-${RELEASE_TAG}.apk"
            dist/SHA256SUMS.txt
            --target "$GITHUB_SHA"
            --title "PixelDenseUI ${RELEASE_TAG}"
            --generate-notes
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f ReleaseKey.jks keystore.properties
